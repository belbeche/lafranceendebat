peace:
  title: 呼唤平静与和平
  text: 在一个局势紧张的国家，愤怒是合法的，暴力永远不会发生。在这里，我们互相倾听，我们寻找，我们提出具体的建议，我们让每个人都有回应的权利。
  cta: 阅读通话和章程
why:
  title: '- 为什么现在接受了？'
  lede: 官方和来源的观察，而不是口号。每个人都可以检查它们，然后进行辩论。
  f1: '2025年公共赤字：占GDP的5.0% ， 2026年目标被视为受到威胁'
  f2: '公共债务： 2025年底34,600亿欧元'
  f3: 2026年债务负担：约770亿欧元，增长约120亿欧元
  src: '资料来源：审计法院， 2026年6月25日的声明，由公共Sénat转发。在报价前检查和更新。'
  more: 公民提到的其他挑战：购买力、就业、压力下的公共服务、信任、能源转型、主权。
tax:
  title: 纳税人：您融资，您有权了解
  lede: 每个提案都应说明其成本、谁支付以及如何衡量结果。以下是具体行动的方法。
  c1t: 理解
  c1d: 审计法院的报告和关于公共支出、开放获取的开放数据。
  c2t: 建议实用优惠
  c2d: 应用马歇尔计划的五个问题规则，并向其来源提交计算成本的提案。
  c3t: 支持所测量的内容
  c3d: 最具来源和成本效益的提案在排名中上升。
  c4t: 询问账号
  c4d: 提交来源声明：直到公开回复为止。
  cta1: '审计 法院 '
  cta2: 开放数据(data.gouv.fr)
themes:
  title: 具体解决方案，按主题
  lede: 选择一个主题：您将找到按支持排序的已发布提案。
steps:
  title: 提案的历程，分为五个步骤
  1: 公民表达自己：他提出一个想法并对优先事项进行投票。
  2: 与该领域的专家和参与者一起审查和分析提案。
  3: 解决方案分为具体项目、成本和时间表。
  4: 他们被带到民选官员和主管机构。
  5: 公民遵循做出的决定和后续行动。
actors:
  title: 公共行为者和贡献者的作用
  lede: 每个人都可以按照相同的规则做出贡献：公开来源、可核实的事实、答辩权。
  a1: 议会（国民议会和参议院）
  a1d: 审查提案，辩论，对法律进行投票，监督其执行情况。
  a2: 地方当局
  a2d: 组织本地辩论，传递提案，实施行动。
  a3: 政府部门
  a3d: 分析可行性，调动资源，确保协调。
  a4: '欧洲 联盟 机构 '
  a4d: 整合提案、支持资金、加强合作。
  a5: 协会、公司、公民
  a5d: 提供现场专业知识、测试、测量和分享结果。
  cta: 成为演员
claims:
  cta: 提交源索赔
  rules: 所有行为者、机构和当事方的共同规则：公开来源、可核实的事实、无侮辱、答辩权、出版前校对。
forces:
