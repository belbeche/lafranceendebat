path.discover.title: أريد أن أتعرف
path.discover.desc: فهم الموقع في ثلاث دقائق، بدون حساب.
path.discover.s1: 'اقرأ ميثاق السلم: قواعد اللعبة.'
path.discover.s2: تصفح المقترحات الأكثر دعمًا.
path.discover.s3: اطلع على ما تم التنديد به ولا ينبغي نسيانه.
path.debate.title: أريد أن أناقش
path.debate.desc: إبداء رأيي والرد على الآخرين بهدوء.
path.debate.s1: اختر نقاشًا مفتوحًا واقرأ الحجج.
path.debate.s2: أنشئ حسابًا مجانيًا (دقيقة واحدة).
path.debate.s3: انشر حجة، مع مصدر إن أمكن.
path.propose.title: أريد أن أقترح
path.propose.desc: تقديم فكرة ملموسة، تُراجَع قبل النشر.
path.propose.s1: تأكد أن الفكرة غير موجودة مسبقًا.
path.propose.s2: أنشئ حسابًا مجانيًا.
path.propose.s3: قدّم المقترح مع مصدر.
path.forgotten.title: أريد ألا يُنسى
path.forgotten.desc: إبقاء مطلب سبق التنديد به حيًا.
path.forgotten.s1: اقرأ المطالب التي لا ينبغي نسيانها.
path.forgotten.s2: ادعم مقترحًا مرتبطًا أو عدّله.
path.forgotten.s3: 'اطلع على المسارات المؤسساتية: العريضة، الاستفتاء، المنتخبون.'
path.follow.title: أريد متابعة المؤسسات
path.follow.desc: معرفة من أجاب ومن التزم الصمت.
path.follow.s1: افتح متابعة المؤسسات.
path.follow.s2: تصفح المرشحين والتزاماتهم.
path.follow.s3: 'لا تفوّت المواعيد: الأجندة.'

guide.label: 'الخطوات المتبعة'
guide.steps: 'خطوات'
guide.page_title: 'الخطوات المتبعة'
guide.page_lede: 'شرح كل وظيفة في الموقع بخطوات قليلة. لا حاجة لأي معرفة تقنية.'
guide.home.t: 'البداية'
guide.home.cta: 'إنشاء حسابي'
guide.home.s1: 'أنشئ حساباً مجانياً (دقيقة واحدة وبريد إلكتروني يكفي).'
guide.home.s2: 'اختر نقطة البداية: نقاش أو اقتراح أو إبداء رأي أو التحرك لدى المؤسسات.'
guide.home.s3: 'عد إلى «مساحتي»: سترى مصير أفكارك وما تبقى عليك فعله.'
guide.communaute.t: 'المشاركة في النقاش'
guide.communaute.cta: 'فتح موضوع'
guide.communaute.s1: 'اقرأ القواعد على اليمين، فهي في أربعة أسطر.'
guide.communaute.s2: 'انقر «فتح موضوع» واكتب موضوعك بهدوء وبعنوان دقيق.'
guide.communaute.s3: 'ردّ على الآخرين بإعادة صياغة فكرتهم أولاً، فهذا يُكافأ في التصنيف.'
guide.communaute.s4: 'رسالة مزعجة؟ استخدم «إبلاغ» وسيرد الفريق مع بيان السبب.'
guide.debats.t: 'المشاركة في نقاش'
guide.debats.cta: 'عرض النقاشات'
guide.debats.s1: 'افتح نقاشاً واقرأ أولاً الوقائع الموثقة.'
guide.debats.s2: 'أضف حجة مؤيدة أو معارضة أو متوازنة، مع مصدر إن أمكن.'
guide.debats.s3: 'ادعم أقوى الحجج حتى لو خالفت رأيك.'
guide.propositions.t: 'تقديم اقتراح ودفعه إلى الأمام'
guide.propositions.cta: 'تقديم اقتراح'
guide.propositions.s1: 'انقر «تقديم اقتراح»: المشكلة والإجراء والكلفة التقديرية ومن يستطيع التنفيذ.'
guide.propositions.s2: 'تتم مراجعته ثم نشره في السجل (عادةً خلال 48 ساعة).'
guide.propositions.s3: 'شاركه: كل دعم يرفعه في التصنيف.'
guide.propositions.s4: 'تابعه في «مساحتي» حتى إحالته إلى المنتخبين.'
guide.scrutins.t: 'إبداء رأيك'
guide.scrutins.cta: 'عرض الاستشارات'
guide.scrutins.s1: 'اختر استشارة مفتوحة.'
guide.scrutins.s2: 'اقرأ الخيارات والحجج.'
guide.scrutins.s3: 'صوّت: صوت واحد لكل شخص والنتيجة استشارية وعلنية.'
guide.services.t: 'إيجاد خدمة أو عرضها'
guide.services.cta: 'عرض الخدمات'
guide.services.s1: 'تصفّح الخدمات (وساطة وتكوين ومرافقة) وافتح المناسبة.'
guide.services.s2: 'اطلب: الدفع مؤمَّن ومحتجز مؤقتاً.'
guide.services.s3: 'تواصل مع المزوّد عبر مراسلة الطلب (دون تقديم بيانات اتصال).'
guide.services.s4: 'أكّد عند إنجاز الخدمة فيُدفع للمزوّد. مشكلة؟ اطلب استرداد المبلغ.'
guide.candidater.t: 'الحصول على دور'
guide.candidater.cta: 'تقديم الترشح'
guide.candidater.s1: 'اختر الصفة: وسيط أو فاعل أو منتخب أو جمعية.'
guide.candidater.s2: 'اشرح في أسطر قليلة ما ستقدمه.'
guide.candidater.s3: 'يرد الفريق. لا يُشترط عمر معيّن للحساب.'
guide.candidater.s4: 'تظهر مساحتك الخاصة في «مساحتي».'
guide.acteurs.t: 'التحرك لدى المؤسسات'
guide.acteurs.cta: 'المسارات المؤسساتية'
guide.acteurs.s1: 'حدّد المنتخب أو المؤسسة أو الوسيط المعني.'
guide.acteurs.s2: 'استخدم المسار القانوني المناسب (عريضة أو إحالة أو رسالة).'
guide.acteurs.s3: 'ثم انشر المتابعة على المنصة ليرى الجميع الرد.'
guide.plan.t: 'تطبيق الخطة قرب مكان إقامتك'
guide.plan.cta: 'تقديم نتيجة'
guide.plan.s1: 'حدّد في الصفحة الإجراء المناسب لوضعك (مواطن أو جمعية أو منتخب أو شركة).'
guide.plan.s2: 'نفّذ أول إجراء في قائمة «هذا الأسبوع».'
guide.plan.s3: 'قدّم النتيجة كاقتراح ليُقارن ويُعتمد في أماكن أخرى.'
