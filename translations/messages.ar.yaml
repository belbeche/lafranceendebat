free.text: مجاني للجميع، إلى الأبد. بلا اشتراك ولا إعلانات ولا بيع للبيانات.
free.title: مجاني، إلى الأبد
free.body: 'منصة «فرنسا في نقاش» مجانية لكل المواطنين وستبقى كذلك: بلا اشتراك، ولا دفع للتسجيل أو التصويت أو تقديم المقترحات، ولا إعلانات ولا إعادة بيع للبيانات الشخصية. لن توضع الوظائف الأساسية خلف جدار دفع أبدًا.'
free.faq_q: هل هو مجاني فعلًا؟
