eco.l1d: 'تشخيص للتكاليف في 3 إلى 5 هياكل متطوعة.'
eco.l2t: 'التجميع'
eco.l2d: 'مشتريات جماعية ووظائف دعم مشتركة دون احتكار.'
eco.l3t: 'إعادة الاستثمار'
eco.l3d: 'كل وفر مثبت يعود إلى التشغيل والمهام المفيدة.'
