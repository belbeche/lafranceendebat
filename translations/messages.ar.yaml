eco.title: 'إنعاش الاقتصاد الفرنسي: خطة مارشال المواطنية'
eco.lede: 'التعافي دون هدم: قياس كل نفقة، وتجميع ما يمكن تجميعه، وإعادة استثمار الوفورات المثبتة في التشغيل والإنتاج والخدمات الأساسية.'
