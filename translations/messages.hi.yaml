path:
  nav: 'मार्गदर्शित रास्ते'
  title: 'आप क्या करना चाहते हैं?'
  subtitle: 'अपनी स्थिति चुनें: हम आपको चरण - दर - चरण इसकी जानकारी देंगे। पढ़ने के लिए अकाउंट की ज़रूरत नहीं है।'
  no_account: 'कोई खाता नहीं'
  account: 'मुफ़्त अकाउंट ज़रूरी है'
  start: 'शुरू करें'
  step: दौर
  all: 'सभी रास्ते'
  go: जाएँ
  discover:
    title: 'मुझे पता चला'
    desc: 'अकाउंट के बिना, तीन मिनट में साइट को समझें।'
    s1: 'शांति चार्टर पढ़ें: खेल के नियम।'
    s2: 'सबसे समर्थित प्रस्ताव ब्राउज़ करें।'
    s3: 'देखें कि क्या रिपोर्ट किया गया है और इसे नहीं भूलना चाहिए।'
  debate:
    title: 'मैं बहस करना चाहता हूँ'
    desc: 'मेरी राय दें और दूसरों को शांति से जवाब दें।'
    s1: 'एक खुली बहस चुनें और तर्कों को पढ़ें।'
    s2: 'एक मुफ़्त अकाउंट बनाएँ (एक मिनट)।'
    s3: 'यदि संभव हो तो स्रोत के साथ एक तर्क प्रकाशित करें।'
  propose:
    title: 'मैं प्रस्ताव देना चाहता हूँ'
    desc: 'प्रकाशन से पहले एक ठोस विचार, प्रूफ रीड सबमिट करें।'
    s1: 'जाँच लें कि यह आइडिया पहले से मौजूद नहीं है।'
    s2: 'मुफ़्त अकाउंट बनाएँ।'
    s3: 'प्रस्ताव को एक स्रोत के साथ सबमिट करें।'
  forgotten:
    title: 'मैं चाहता हूँ कि इसे भुलाया न जाए'
    desc: 'पहले से ही निंदा किए गए दावे को जीवन में लाना।'
    s1: 'याद रखने के लिए क्लेम पढ़ें।'
    s2: 'संबंधित प्रस्ताव का समर्थन करें या उसमें संशोधन करें।'
    s3: 'संस्थागत चैनल देखें: याचिका, आरआईपी, निर्वाचित अधिकारी।'
  follow:
    title: 'मैं संस्थानों का अनुसरण करना चाहता हूँ'
    desc: 'जानें कि किसने जवाब दिया, और कौन चुप रहा।'
    s1: 'संस्थानों की निगरानी खोलें।'
    s2: 'उम्मीदवारों और उनकी प्रतिबद्धताओं के साथ परामर्श करें।'
    s3: 'अपॉइंटमेंट से न चूकें: एजेंडा।'
footer:
  project: 'ग्लेड योजना'
  legal: लीगल
  independent: 'स्वतंत्र और बहुलवादी नागरिक स्थान। यह किसी भी पार्टी, उम्मीदवार या संस्था से संबद्ध नहीं है।'
  disclaimer: 'इस साइट के परामर्श का कोई आधिकारिक चुनाव मूल्य नहीं है।'
