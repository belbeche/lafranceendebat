  subtitle: 'आप इसे कभी भी मेनू से बदल सकते हैं।'
  continue: '%language% में जारी रखें'
  other_note: 'इस भाषा का पूरा इंटरफ़ेस अभी नहीं है: मेनू अंग्रेज़ी में दिखता है। बाकी साइट के लिए अपने ब्राउज़र का स्वचालित अनुवाद इस्तेमाल करें।'
