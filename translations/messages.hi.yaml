free:
  badge: 'जीवन भर मुफ़्त'
  text: 'सबके लिए हमेशा मुफ़्त। न सदस्यता, न विज्ञापन, न डेटा की बिक्री।'
  title: 'हमेशा के लिए मुफ़्त'
  body: 'बहस में फ़्रांस सभी नागरिकों के लिए मुफ़्त है और रहेगा: कोई सदस्यता नहीं, पंजीकरण, वोट या प्रस्ताव करने के लिए कोई भुगतान नहीं, कोई विज्ञापन नहीं और व्यक्तिगत डेटा की कोई पुनर्विक्रय नहीं। बुनियादी फ़ंक्शंस को कभी भी भुगतान के पीछे नहीं रखा जाएगा।'
  faq_q: 'क्या यह वाकई मुफ़्त है?'
