guide:
  label: प्रक्रिया
  steps: कदम
  page_title: प्रक्रिया
  page_lede: 'साइट के प्रत्येक कार्य को कुछ चरणों में समझाया गया है। किसी तकनीकी जानकारी की ज़रूरत नहीं है।'
  home:
    t: 'शुरू करना'
    cta: 'मेरा अकाउंट बनाएँ'
    s1: 'एक मुफ़्त अकाउंट बनाएँ (एक मिनट, एक ईमेल काफ़ी है)।'
    s2: 'अपना मुख्य दरवाज़ा चुनें: बहस करें, प्रस्ताव दें, अपनी राय दें या संस्थानों के साथ काम करें।'
    s3: '"मेरी जगह" पर वापस आएं: आप देख सकते हैं कि आपके विचार कहाँ खड़े हैं और आपको अभी भी क्या करने की आवश्यकता है।'
  communaute:
    t: 'बातचीत में शामिल हों'
    cta: 'ओपन वायर'
    s1: 'दाईं ओर के नियमों को पढ़ें, वे चार पंक्तियों में फिट होते हैं।'
    s2: '"एक थ्रेड खोलें" पर क्लिक करें और एक सटीक शीर्षक के साथ अपने विषय को शांति से लिखें।'
    s3: 'पहले अपने विचार को सुधारकर दूसरों को जवाब दें: यह रैंकिंग में मूल्यवान है।'
    s4: 'एक कष्टप्रद संदेश? "रिपोर्ट" का उपयोग करें, टीम एक कारण के साथ जवाब देती है।'
  debats:
    t: 'बहस में हिस्सा लें'
    cta: 'वाद - विवाद देखें'
    s1: 'एक बहस खोलें और पहले सोर्स किए गए तथ्यों को पढ़ें।'
    s2: 'यदि संभव हो तो स्रोत के साथ, के खिलाफ, या बारीक के लिए एक तर्क जोड़ें।'
    s3: 'सबसे मजबूत तर्कों का समर्थन करें, भले ही वे आपकी राय के खिलाफ हों।'
  propositions:
    t: 'एक प्रस्ताव सबमिट करें और उसे आगे बढ़ाएँ'
    cta: 'एक प्रस्ताव सबमिट करें'
    s1: '"प्रस्ताव सबमिट करें" पर क्लिक करें: समस्या, माप, अनुमानित लागत, कौन कार्रवाई कर सकता है।'
    s2: 'इसकी समीक्षा की जाती है और फिर रजिस्टर में प्रकाशित किया जाता है (आमतौर पर 48 घंटों के भीतर)।'
    s3: 'इसे साझा करें: प्रत्येक समर्थक इसे रैंकिंग में आगे बढ़ाता है।'
    s4: 'इसे "मेरी जगह" में तब तक फ़ॉलो करें, जब तक कि यह चुने हुए अधिकारियों को न दी जाए।'
  scrutins:
    t: 'फ़ीडबैक दें'
    cta: 'पोल देखें'
    s1: 'एक खुला मतपत्र चुनें।'
    s2: 'विकल्प और तर्क पढ़ें।'
    s3: 'वोट: प्रति व्यक्ति एक वोट, सलाहकार और सार्वजनिक परिणाम।'
  services:
    t: 'कोई सेवा ढूँढें या ऑफ़र करें'
    cta: 'सेवाएँ देखें'
    s1: 'सेवाओं (मध्यस्थता, प्रशिक्षण, सहायता) के माध्यम से जाएं और सही को खोलें।'
    s2: 'चेक आउट: भुगतान सुरक्षित है और होल्ड पर है।'
    s3: 'ऑर्डर मैसेजिंग सिस्टम के ज़रिए सेवा प्रदाता के साथ आदान - प्रदान करें (कोई संपर्क विवरण नहीं दिया जाना चाहिए)।'
    s4: 'पुष्टि करें कि सेवा कब प्रदान की जाती है: इसके बाद सेवा प्रदाता को भुगतान किया जाता है। समस्या हो रही है? रिफ़ंड का अनुरोध करें।'
  candidater:
    t: 'कोई भूमिका पाएँ'
    cta: 'लागू करें'
    s1: 'सही चुनें: मध्यस्थ, अभिनेता, निर्वाचित अधिकारी या संघ।'
    s2: 'कुछ पंक्तियों में समझाएं कि आप क्या लाएंगे।'
    s3: 'टीम जवाब देती है। अकाउंट की वरिष्ठता की ज़रूरत नहीं है।'
    s4: 'आपकी खास जगह "मेरी जगह" में दिखाई देती है।'
  acteurs:
    t: 'संस्थानों के साथ काम करना'
    cta: 'संस्थागत रास्ते'
    s1: 'संबंधित निर्वाचित अधिकारी, संस्थान या मध्यस्थ का पता लगाएं।'
    s2: 'उपयुक्त कानूनी चैनल (याचिका, रेफरल, पत्र) का उपयोग करें।'
    s3: 'फिर सभी को जवाब देखने के लिए ट्रैकर को प्लैटफ़ॉर्म पर ड्रॉप करें।'
  plan:
    t: 'अपने आस - पास की योजना लागू करें'
    cta: 'परिणाम सबमिट करें'
    s1: 'पृष्ठ में उस कार्रवाई का पता लगाएं जो आपकी स्थिति (नागरिक, संघ, निर्वाचित अधिकारी, कंपनी) से मेल खाती है।'
    s2: '"इस सप्ताह" सूची में पहली कार्रवाई करें।'
    s3: 'परिणाम को एक प्रस्ताव के रूप में सबमिट करें ताकि इसकी तुलना की जा सके और इसे कहीं और दोहराया जा सके।'
