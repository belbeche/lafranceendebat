peace.title: 'A call for calm and peace'
peace.text: 'In a country under tension, anger can be legitimate, violence never is. Here we listen, cite sources, offer concrete solutions and give everyone a right of reply.'
peace.cta: 'Read the appeal and the charter'
why.title: 'Why now?'
why.lede: 'Official, sourced findings, not slogans. Anyone can check them, then debate them.'
why.f1: 'Public deficit 2025: 5.0% of GDP, 2026 target judged at risk'
why.f2: 'Public debt: €3,460 billion at end of 2025'
why.f3: 'Debt service 2026: about €77 billion, up about €12 billion'
why.src: 'Source: Cour des comptes, findings of 25 June 2026, reported by Public Sénat. Check and update before quoting.'
why.more: 'Other challenges raised by citizens: purchasing power, jobs, strained public services, trust, energy transition, sovereignty.'
tax.title: 'Taxpayers: you pay, you have the right to understand'
tax.lede: 'Every proposal must say what it costs, who pays and how results are measured. Here is how to act.'
tax.c1t: 'Understand'
tax.c1d: 'Cour des comptes reports and open data on public spending, freely available.'
tax.c2t: 'Propose a useful saving'
tax.c2d: 'Apply the Marshall Plan five-question rule and submit a costed proposal with its source.'
tax.c3t: 'Back what is measured'
tax.c3d: 'The best sourced and costed proposals rise in the ranking.'
tax.c4t: 'Ask for accountability'
tax.c4d: 'File a sourced claim: it is tracked until a public answer.'
tax.cta1: 'Cour des comptes reports'
tax.cta2: 'Open data (data.gouv.fr)'
themes.title: 'Concrete solutions, by topic'
themes.lede: 'Pick a topic: see the published proposals, ranked by support.'
steps.title: 'The path of a proposal, in five steps'
steps.1: 'Citizens speak: they propose ideas and vote on priorities.'
steps.2: 'Proposals are reviewed and analysed with experts and people on the ground.'
steps.3: 'Solutions are grouped into concrete, costed projects with a timetable.'
steps.4: 'They are brought to the competent elected officials and institutions.'
steps.5: 'Citizens follow the decisions and what follows.'
actors.title: 'The role of public actors and contributors'
actors.lede: 'Everyone can contribute under the same rules: public source, verifiable facts, right of reply.'
actors.a1: 'Parliament (National Assembly and Senate)'
actors.a1d: 'Examine proposals, debate, vote laws, monitor implementation.'
actors.a2: 'Local authorities'
actors.a2d: 'Hold local debates, relay proposals, carry out actions.'
actors.a3: 'State services'
actors.a3d: 'Assess feasibility, mobilise resources, ensure coordination.'
actors.a4: 'European institutions'
actors.a4d: 'Integrate proposals, support funding, strengthen cooperation.'
actors.a5: 'Associations, businesses, citizens'
actors.a5d: 'Bring field expertise, test, measure, share results.'
actors.cta: 'Become an actor'
claims.cta: 'File a sourced claim'
claims.rules: 'Rule for all actors, institutions and parties alike: public source, verifiable facts, no insults, right of reply, review before publication.'
forces.title: 'Understand to choose better'
forces.lede: 'The main political currents presented with the same structure, no scores or rankings. You compare.'
forces.cta: 'See the political currents'
run.title: 'Running in the 2027 presidential election: the rules'
run.c1: 'Be French, at least 18, and registered on an electoral roll.'
run.c2: 'Not be declared ineligible nor under guardianship, and have met national service obligations.'
run.c3: 'Obtain 500 sponsorships from elected officials, from at least 30 departments or overseas collectivities, at most one tenth from the same department.'
run.c4: 'File an interests declaration and an asset declaration with the Constitutional Council.'
run.src: 'Source: LCP, candidacy conditions. Official dates are published by the Constitutional Council.'
run.cta: 'Constitutional Council'
