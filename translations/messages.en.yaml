eco.title: 'Restarting the French economy: the Citizen Marshall Plan'
eco.lede: 'Recover without breaking things: measure every expense, pool what can be pooled, reinvest proven savings in jobs, production and essential services.'
eco.l1t: 'Measure'
eco.l1d: 'A cost diagnosis in 3 to 5 volunteer organisations.'
eco.l2t: 'Pool'
eco.l2d: 'Joint purchasing and shared support functions, no monopoly.'
eco.l3t: 'Reinvest'
eco.l3d: 'Every proven saving goes back into jobs and useful missions.'
eco.cta: 'Read the plan'
eco.cta2: 'Act this week'
