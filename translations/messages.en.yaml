guide.label: 'Step-by-step guide'
guide.steps: 'steps'
guide.page_title: 'Step-by-step guide'
guide.page_lede: 'Every feature of the site explained in a few steps. No technical knowledge needed.'
guide.home.t: 'Getting started'
guide.home.cta: 'Create my account'
guide.home.s1: 'Create a free account (one minute, an e-mail is enough).'
guide.home.s2: 'Pick your entry point: debate, propose, give your opinion or act with institutions.'
guide.home.s3: 'Come back to “My space”: it shows where your ideas stand and what is left to do.'
guide.communaute.t: 'Join the conversation'
guide.communaute.cta: 'Start a thread'
guide.communaute.s1: 'Read the rules on the right, they fit in four lines.'
guide.communaute.s2: 'Click “Start a thread” and write your topic calmly, with a precise title.'
guide.communaute.s3: 'Reply to others by first rephrasing their idea: it is rewarded in the ranking.'
guide.communaute.s4: 'A problematic message? Use “Report”, the team answers with a reason.'
guide.debats.t: 'Take part in a debate'
guide.debats.cta: 'See debates'
guide.debats.s1: 'Open a debate and first read the sourced facts.'
guide.debats.s2: 'Add an argument for, against or nuanced, with a source if possible.'
guide.debats.s3: 'Support the strongest arguments, even if they go against your view.'
guide.propositions.t: 'Submit and advance a proposal'
guide.propositions.cta: 'Submit a proposal'
guide.propositions.s1: 'Click “Submit a proposal”: problem, measure, estimated cost, who can act.'
guide.propositions.s2: 'It is reviewed then published in the register (usually within 48 h).'
guide.propositions.s3: 'Share it: each support moves it up the ranking.'
guide.propositions.s4: 'Follow it in “My space” until it is passed to elected officials.'
guide.scrutins.t: 'Give your opinion'
guide.scrutins.cta: 'See ballots'
guide.scrutins.s1: 'Choose an open ballot.'
guide.scrutins.s2: 'Read the options and the arguments.'
guide.scrutins.s3: 'Vote: one voice per person, consultative and public result.'
guide.services.t: 'Find or offer a service'
guide.services.cta: 'See services'
guide.services.s1: 'Browse the services (mediation, training, support) and open the right one.'
guide.services.s2: 'Order: payment is secured and held until completion.'
guide.services.s3: 'Talk to the provider through the order messaging (no contact details to give).'
guide.services.s4: 'Confirm when the service is done: the provider is then paid. A problem? Ask for a refund.'
guide.candidater.t: 'Get a role'
guide.candidater.cta: 'Apply'
guide.candidater.s1: 'Choose the right: mediator, actor, elected official or association.'
guide.candidater.s2: 'Explain in a few lines what you will bring.'
guide.candidater.s3: 'The team answers. No account seniority is required.'
guide.candidater.s4: 'Your dedicated space appears in “My space”.'
guide.acteurs.t: 'Act with institutions'
guide.acteurs.cta: 'Institutional routes'
guide.acteurs.s1: 'Find the elected official, institution or mediator concerned.'
guide.acteurs.s2: 'Use the right legal route (petition, referral, letter).'
guide.acteurs.s3: 'Then post the follow-up on the platform so everyone sees the answer.'
guide.plan.t: 'Apply the plan where you live'
guide.plan.cta: 'Submit a result'
guide.plan.s1: 'Find on the page the action that fits your situation (citizen, association, elected official, business).'
guide.plan.s2: 'Do the first action in the “this week” list.'
guide.plan.s3: 'Submit the result as a proposal so it can be compared and reused elsewhere.'
