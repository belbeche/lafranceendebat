commons.notice: 'This work belongs to no one: it is the result of contributions from citizens around the world. It rightfully belongs to no single person, and the effort must go on, carried by everyone.'
commons.title: 'A common good'
commons.text: 'This project does not belong to its initiator. Every citizen of the world who proposes, reviews, translates, checks or debates is a co-author. No one can claim ownership by right. For it to last, the effort must continue: contribute, pass it on, invite others.'
