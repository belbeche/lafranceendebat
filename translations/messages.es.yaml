guide.label: 'Guía paso a paso'
guide.steps: 'pasos'
guide.page_title: 'Guía paso a paso'
guide.page_lede: 'Cada función del sitio explicada en pocos pasos. No se requiere ningún conocimiento técnico.'
guide.home.t: 'Empezar'
guide.home.cta: 'Crear mi cuenta'
guide.home.s1: 'Cree una cuenta gratuita (un minuto, basta un correo).'
guide.home.s2: 'Elija su puerta de entrada: debatir, proponer, opinar o actuar ante las instituciones.'
guide.home.s3: 'Vuelva a «Mi espacio»: verá cómo van sus ideas y qué le queda por hacer.'
guide.communaute.t: 'Participar en la conversación'
guide.communaute.cta: 'Abrir un hilo'
guide.communaute.s1: 'Lea las reglas a la derecha, caben en cuatro líneas.'
guide.communaute.s2: 'Haga clic en «Abrir un hilo» y escriba su tema con calma y un título preciso.'
guide.communaute.s3: 'Responda a los demás reformulando primero su idea: se valora en la clasificación.'
guide.communaute.s4: '¿Un mensaje molesto? Use «Denunciar», el equipo responde con un motivo.'
guide.debats.t: 'Participar en un debate'
guide.debats.cta: 'Ver los debates'
guide.debats.s1: 'Abra un debate y lea primero los hechos con fuentes.'
guide.debats.s2: 'Añada un argumento a favor, en contra o matizado, con fuente si es posible.'
guide.debats.s3: 'Apoye los argumentos más sólidos, aunque vayan contra su opinión.'
guide.propositions.t: 'Presentar y hacer avanzar una propuesta'
guide.propositions.cta: 'Presentar una propuesta'
guide.propositions.s1: 'Haga clic en «Presentar una propuesta»: problema, medida, coste estimado, quién puede actuar.'
guide.propositions.s2: 'Se revisa y se publica en el registro (en general en 48 h).'
guide.propositions.s3: 'Compártala: cada apoyo la hace subir en la clasificación.'
guide.propositions.s4: 'Sígala en «Mi espacio» hasta su traslado a los cargos electos.'
guide.scrutins.t: 'Dar su opinión'
guide.scrutins.cta: 'Ver las consultas'
guide.scrutins.s1: 'Elija una consulta abierta.'
guide.scrutins.s2: 'Lea las opciones y los argumentos.'
guide.scrutins.s3: 'Vote: una voz por persona, resultado consultivo y público.'
guide.services.t: 'Encontrar u ofrecer un servicio'
guide.services.cta: 'Ver los servicios'
guide.services.s1: 'Explore los servicios (mediación, formación, acompañamiento) y abra el adecuado.'
guide.services.s2: 'Pida: el pago es seguro y queda retenido.'
guide.services.s3: 'Hable con el prestador por la mensajería del pedido (sin dar datos de contacto).'
guide.services.s4: 'Confirme cuando el servicio esté hecho: entonces se paga al prestador. ¿Un problema? Pida un reembolso.'
guide.candidater.t: 'Obtener un rol'
guide.candidater.cta: 'Postular'
guide.candidater.s1: 'Elija el derecho: mediador, actor, cargo electo o asociación.'
guide.candidater.s2: 'Explique en pocas líneas lo que aportará.'
guide.candidater.s3: 'El equipo responde. No se exige antigüedad de la cuenta.'
guide.candidater.s4: 'Su espacio dedicado aparece en «Mi espacio».'
guide.acteurs.t: 'Actuar ante las instituciones'
guide.acteurs.cta: 'Vías institucionales'
guide.acteurs.s1: 'Encuentre al cargo electo, la institución o el mediador correspondiente.'
guide.acteurs.s2: 'Use la vía legal adecuada (petición, recurso, carta).'
guide.acteurs.s3: 'Publique después el seguimiento en la plataforma para que todos vean la respuesta.'
guide.plan.t: 'Aplicar el plan cerca de usted'
guide.plan.cta: 'Presentar un resultado'
guide.plan.s1: 'Localice en la página la acción que corresponde a su situación (ciudadano, asociación, cargo electo, empresa).'
guide.plan.s2: 'Haga la primera acción de la lista «esta semana».'
guide.plan.s3: 'Presente el resultado como propuesta para que se compare y se replique en otros lugares.'
