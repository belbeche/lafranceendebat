eco.title: 'Relanzar la economía francesa: el Plan Marshall ciudadano'
eco.lede: 'Recuperar sin romper: medir cada gasto, mutualizar lo que se pueda y reinvertir los ahorros demostrados en empleo, producción y servicios esenciales.'
eco.l1t: 'Medir'
eco.l1d: 'Un diagnóstico de costes en 3 a 5 estructuras voluntarias.'
eco.l2t: 'Mutualizar'
eco.l2d: 'Compras conjuntas y funciones de apoyo compartidas, sin monopolio.'
eco.l3t: 'Reinvertir'
eco.l3d: 'Cada ahorro demostrado vuelve al empleo y a las misiones útiles.'
eco.cta: 'Leer el plan'
eco.cta2: 'Actuar esta semana'
