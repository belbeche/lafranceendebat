free.title: Gratis, para siempre
free.body: 'La France en Débat es y seguirá siendo gratuita para todos los ciudadanos: sin suscripción, sin pago para registrarse, votar o proponer, sin publicidad y sin reventa de datos personales. Las funciones básicas nunca estarán detrás de un pago.'
