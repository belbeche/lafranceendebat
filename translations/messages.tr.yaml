why:
  title: 'Neden şimdi?"<ex id="_4"/>'
  lede: 'Sloganlar değil, resmi ve kaynaklı gözlemler. Herkes onları kontrol edebilir ve daha sonra tartışabilir.'
  f1: "Kamu açığı 2025 : GSYİH'nın % 5,0 'i, hedef 2026 tehdit altında kabul ediliyor"
  f2: 'Kamu borcu: 2025 yılı sonunda 3.460 milyar Euro'
  f3: 'Borç yükü 2026: yaklaşık 77 milyar Euro, yaklaşık 12 milyar Euro'
  src: 'Kaynak: Sayıştay, 25 Haziran 2026 tarihli açıklama, Kamu Sénat tarafından iletilmiştir. Tekliften önce kontrol edilecek ve güncellenecektir.'
  more: 'Vatandaşlar tarafından belirtilen diğer zorluklar: satın alma gücü, istihdam, baskı altındaki kamu hizmetleri, güven, enerji geçişi, egemenlik.'
tax:
  title: 'Vergi mükellefleri: finanse ediyorsunuz, anlama hakkına sahipsiniz'
  lede: 'Her teklif, maliyetin ne kadar olduğunu, kimin ödediğini ve sonucun nasıl ölçüldüğünü belirtmelidir. İşte somut olarak nasıl hareket edeceğiniz.'
  c1t: Anlamak
  c1d: 'Sayıştay raporları ve kamu harcamalarına ilişkin açık veriler, açık erişim.'
  c2t: 'Yararlı tasarruflar önerin'
  c2d: 'Marshall Planının beş soruluk kuralını uygulayın ve maliyetlendirilmiş bir teklifi kaynağıyla birlikte dosyalayın.'
  c3t: 'Ölçülenleri destekleyin'
  c3d: 'En iyi kaynaklı ve maliyetlendirilmiş teklifler sıralamada yükselir.'
  c4t: 'Hesap isteyin'
  c4d: 'Kaynaklı bir talepte bulunun: kamuya açık bir cevaba kadar takip edilir.'
  cta1: 'Sayıştay Raporları'
  cta2: 'Açık veri (data.gouv.fr)'
