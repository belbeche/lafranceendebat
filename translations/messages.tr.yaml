  a3: 'Devlet daireleri'
  a3d: 'Fizibiliteyi analiz edin, kaynakları harekete geçirin, koordinasyonu sağlayın.'
  a4: 'Avrupa kurumları'
  a4d: 'Teklifleri entegre edin, finansmanı destekleyin, işbirliğini güçlendirin.'
  a5: 'Dernekler, şirketler, vatandaşlar'
  a5d: 'Saha uzmanlığı sağlayın, test edin, ölçün, sonuçları paylaşın.'
  cta: 'Oyuncu ol'
