  title: 'Beş adımda bir teklifin yolculuğu'
  1: 'Vatandaş kendini ifade eder: bir fikir önerir ve öncelikleri oylar.'
  2: 'Teklifler, alandaki uzmanlar ve aktörlerle birlikte gözden geçirilir ve analiz edilir.'
  3: 'Çözümler, bir zaman çizelgesi ile maliyetlendirilmiş somut projeler halinde gruplandırılır.'
  4: 'Seçilen görevlilere ve yetkili kurumlara getirilir.'
  5: 'Vatandaşlar verilen kararları ve takibi takip eder.'
