door.debate: 'Leggi i fatti, poi aggiungi un argomento.'
door.propose: 'Compila 4 campi, revisione entro 48 ore.'
door.opinion: 'Scegli una consultazione, vota una volta.'
door.petition: 'Apri, leggi, clicca su sostieni.'
door.institutions: 'Scegli la via legale e segui la risposta.'
door.candidates: 'Apri due schede affiancate.'
eco.title: 'Rilanciare l''economia francese: il Piano Marshall dei cittadini'
eco.lede: 'Risanare senza distruggere: misurare ogni spesa, mettere in comune ciò che si può e reinvestire i risparmi provati in lavoro, produzione e servizi essenziali.'
eco.l1t: 'Misurare'
eco.l1d: 'Una diagnosi dei costi in 3-5 strutture volontarie.'
eco.l2t: 'Mettere in comune'
eco.l2d: 'Acquisti di gruppo e funzioni di supporto condivise, senza monopolio.'
eco.l3t: 'Reinvestire'
eco.l3d: 'Ogni risparmio provato torna a lavoro e missioni utili.'
eco.cta: 'Leggi il piano'
eco.cta2: 'Agisci questa settimana'
