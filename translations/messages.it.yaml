home.how.1t: '1. Mi iscrivo'
home.how.1d: 'Gratis per sempre, basta un''e-mail.'
home.how.2t: '2. Partecipo'
home.how.2d: 'Dibattito, proposta, consultazione, petizione o messaggio a un eletto.'
home.how.2l: 'Scegli come'
