guide:
  label: 手順
  steps: ステップ
  page_title: 手順
  page_lede: サイトの各機能は、いくつかのステップで説明されています。技術的な知識は必要ありません。
  home:
    t: お食事のはじめに
    cta: マイアカウントを作成する
    s1: '無料アカウントを作成します（ 1分、1メールで十分です）。'
    s2: あなたの正面玄関を選択してください：議論、提案、意見を述べる、または機関と一緒に行動してください。
    s3: 「マイスペース」に戻ってください。自分のアイデアがどこにあるのか、まだ何をする必要があるのかを確認できます。
  communaute:
    t: 会話に参加する
    cta: ワイヤーを開く
    s1: 右側のルールを読んでください。4行に分かれています。
    s2: 「スレッドを開く」をクリックして、トピックを正確なタイトルで冷静に書きましょう。
    s3: 最初にアイデアを再構築して他の人に応答します。それはランキングで評価されています。
    s4: 迷惑なメッセージですか？「レポート」を使用すると、チームは理由を返信します。
  debats:
    t: 討論に参加する
    cta: 議論を表示
    s1: 討論を開始し、最初にソースの事実を読んでください。
    s2: 可能であれば、ソースを使用して、「for」、「against」、または「nuanced」の引数を追加します。
    s3: たとえあなたの意見に反していても、最も強い主張を支持してください。
  propositions:
    t: 提案書を提出して進める
    cta: 提案書を提出する
    s1: 「提案を提出する」をクリックします：問題、対策、推定コスト、誰が行動できるか。
    s2: 審査後、登録簿に掲載されます（通常48時間以内）。
    s3: シェア：各サポーターがランキングを上げます。
    s4: 選出された役人に引き継がれるまで、「マイスペース」でフォローしてください。
  scrutins:
    t: フィードバックを送る
    cta: アンケートを表示
    s1: オープン投票を選択してください。
    s2: オプションと引数を読みます。
    s3: '投票： 1人につき1票、アドバイザリーと公開結果。'
  services:
    t: サービスを検索または提供する
    cta: サービスを表示
    s1: サービス（調停、トレーニング、サポート）を通過し、適切なものを開きます。
    s2: チェックアウト：お支払いは安全で、保留されています。
    s3: 注文メッセージングシステムを介してサービスプロバイダと交換します（連絡先の詳細は提供されません）。
    s4: サービスがいつ提供されるかを確認します。その後、サービスプロバイダに支払いが行われます。お困りですか？返金をリクエストしてください。
  candidater:
    t: 役割を取得する
    cta: 応募する
    s1: メディエーター、アクター、選出された役員、またはアソシエーションのいずれかを選択します。
    s2: 何を持参するかを数行で説明します。
    s3: チームが応答します。アカウントの年功序列は必要ありません。
    s4: 専用スペースは「マイスペース」に表示されます。
  acteurs:
    t: 機関との連携
    cta: 制度的経路
    s1: 関連する選出された役員、機関、または調停者を見つけます。
    s2: 適切な法的チャネル（請願書、紹介状、手紙）を使用してください。
    s3: 次に、プラットフォーム上にトラッカーをドロップして、全員が答えを確認できるようにします。
  plan:
    t: お近くのプランを適用
    cta: 結果を送信
    s1: あなたの状況（市民、協会、選出された役員、会社）に対応するアクションをページで見つけます。
    s2: 「今週」リストの最初のアクションを実行します。
    s3: 他の場所で比較して繰り返すことができるように、結果を提案として提出します。
