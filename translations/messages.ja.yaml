contacts:
  title: 役に立つ連絡先
  lede: 誰に連絡し、何をすべきか。リンクと公式番号は、電話をかける前に各組織のウェブサイトで確認する必要があります。
peace:
  title: 落ち着きと平和を求める
  text: 緊張状態にある国では、怒りは正当であり、暴力は決して正当ではありません。ここでは、お互いに耳を傾け、調達し、具体的な提案を行い、誰もが応答する権利を残します。
  cta: コールとチャーターを読む
why:
  title: 'どうして 今なの？'
  lede: スローガンではなく、公式およびソースによる観察。誰でも確認して議論することができます。
  f1: '2025年の公的赤字： GDPの5.0 ％、2026年の目標は脅威と見なされる'
  f2: '公的債務： 2025年末時点で34,600億ユーロ'
  f3: 2026年の債務負担：約770億ユーロ、約120億ユーロ増加
  src: '出典： Court of Auditors, statement of 25 June 2026, relayed by Public Sénat.見積もりの前に確認して更新します。'
  more: 市民が挙げたその他の課題：購買力、雇用、プレッシャー下の公共サービス、信頼、エネルギー転換、主権。
tax:
  title: 納税者：あなたは資金を調達し、理解する権利があります
  lede: 各提案には、費用、支払い方法、結果をどのように測定するかを記載する必要があります。具体的に行動する方法は次のとおりです。
  c1t: 理解
  c1d: 公的支出、オープンアクセスに関する監査裁判所の報告書とオープンデータ。
  c2t: お得な料金を提案する
  c2d: マーシャルプランの5つの質問ルールを適用し、そのソースに費用のかかる提案書を提出します。
  c3t: 測定されたものをサポートする
  c3d: 最高の調達とコストがかかった提案は、ランキングで上昇します。
  c4t: アカウントを尋ねる
  c4d: ソース化されたクレームを提出する：公開の応答があるまでフォローされます。
  cta1: 監査裁判所の報告
  cta2: 'オープンデータ（ data.gouv.fr ）'
themes:
  title: 主題別の具体的な解決策
  lede: トピックを選択すると、公開された提案がサポートごとに並べ替えられて表示されます。
steps:
  title: 提案の流れを5つのステップで
  1: 市民は自分自身を表現します。彼はアイデアを提案し、優先順位に投票します。
  2: 提案は、この分野の専門家や関係者と共にレビューおよび分析されます。
  3: ソリューションは、具体的なプロジェクトにグループ化され、コストが計上され、スケジュールが設定されています。
  4: 彼らは選挙で選ばれた役人や管轄機関に連れて行かれます。
  5: 市民は、与えられた決定とフォローアップに従います。
actors:
  title: 公的アクターと貢献者の役割
  lede: 公的な情報源、検証可能な事実、返答権など、誰もが同じルールで貢献することができます。
  a1: 議会（国民議会と上院）
  a1d: 提案を見直し、議論し、法律に投票し、その実施を監視します。
  a2: 地方公共団体
  a2d: 地元の議論を組織し、提案を伝え、行動を実行します。
  a3: 官公庁
  a3d: 実現可能性を分析し、リソースを動員し、調整を確保します。
  a4: 欧州機関
  a4d: 提案を統合し、資金調達を支援し、協力を強化します。
  a5: 団体、企業、市民
  a5d: 現場の専門知識を提供し、テストし、測定し、結果を共有します。
  cta: 俳優になる
claims:
  cta: 調達された請求を提出する
  rules: すべてのアクター、機関、および当事者の共通ルール：公的な情報源、検証可能な事実、侮辱しない、返答権、出版前の校正。
forces:
  title: より良い選択のために理解する
  lede: 主要な政治的流れは、格付けやランキングなしで、同じ構造で提示されています。比較するのはあなた次第です。
  cta: 政治勢力を見る
run:
  title: 2027年の大統領選挙：ルール
  c1: フランス国籍を持ち、18歳以上で、選挙人名簿に登録されていること。
  c2: 国家奉仕の義務を果たしたことについて、資格がないと宣言されたり、後見や保佐の下に置かれたりすることはありません。
  c3: 少なくとも30の海外部門またはコミュニティから選出された公務員のスポンサーシップを500回獲得し、同じ部門では最大で10分の1を獲得する。
  c4: 憲法審議会に利害関係の宣言と資産の宣言を提出する。
  src: '出典： LCP、アプリケーション要件。正式な日付は、憲法審議会によって公表されます。'
  cta: 憲法審議会
final:
  title: 一緒に、私たちの声を届けましょう
  lede: 議論のフランス、それはあなた、それは私たち、それは今です。
  w1: 声を上げる
  w2: 討論
  w3: 投票
  w4: アクション
  w5: 明日の構築
