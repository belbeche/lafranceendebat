eco:
  title: フランス経済の復活：シチズン・マーシャル・プラン
  lede: 中断することなくまっすぐに：各経費を測定し、可能なものをプールし、雇用、生産、不可欠なサービスに実証済みの節約を再投資します。
  l1t: è¨æ¸¬
  l1d: '3 ～ 5の任意構造におけるコストの診断。'
  l2t: プール
  l2d: 独占せずに、グループ購入とサポート機能の共有。
