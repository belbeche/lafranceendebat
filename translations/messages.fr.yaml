guide.label: 'Marche à suivre'
guide.steps: 'étapes'
guide.page_title: 'Marche à suivre'
guide.page_lede: 'Chaque fonction du site, expliquée en quelques étapes. Aucune connaissance technique requise.'
guide.home.t: 'Bien commencer'
guide.home.cta: 'Créer mon compte'
guide.home.s1: 'Créez un compte gratuit (une minute, un e-mail suffit).'
guide.home.s2: 'Choisissez votre porte d''entrée : débattre, proposer, donner votre avis ou agir auprès des institutions.'
guide.home.s3: 'Revenez sur « Mon espace » : vous y voyez où en sont vos idées et ce qu''il vous reste à faire.'
guide.communaute.t: 'Prendre part à la conversation'
guide.communaute.cta: 'Ouvrir un fil'
guide.communaute.s1: 'Lisez les règles à droite, elles tiennent en quatre lignes.'
guide.communaute.s2: 'Cliquez sur « Ouvrez un fil » et écrivez votre sujet calmement, avec un titre précis.'
guide.communaute.s3: 'Répondez aux autres en reformulant d''abord leur idée : c''est valorisé au classement.'
guide.communaute.s4: 'Un message gênant ? Utilisez « Signaler », l''équipe répond avec un motif.'
guide.debats.t: 'Participer à un débat'
guide.debats.cta: 'Voir les débats'
guide.debats.s1: 'Ouvrez un débat et lisez d''abord les faits sourcés.'
guide.debats.s2: 'Ajoutez un argument pour, contre ou nuancé, avec une source si possible.'
guide.debats.s3: 'Soutenez les arguments les plus solides, même s''ils vont contre votre avis.'
guide.propositions.t: 'Déposer et faire avancer une proposition'
guide.propositions.cta: 'Déposer une proposition'
guide.propositions.s1: 'Cliquez sur « Déposer une proposition » : problème, mesure, coût estimé, qui peut agir.'
guide.propositions.s2: 'Elle est relue puis publiée au registre (sous 48 h en général).'
guide.propositions.s3: 'Partagez-la : chaque soutien la fait monter dans le classement.'
guide.propositions.s4: 'Suivez-la dans « Mon espace » jusqu''à sa transmission aux élus.'
guide.scrutins.t: 'Donner votre avis'
guide.scrutins.cta: 'Voir les scrutins'
guide.scrutins.s1: 'Choisissez un scrutin ouvert.'
guide.scrutins.s2: 'Lisez les options et les arguments.'
guide.scrutins.s3: 'Votez : une voix par personne, résultat consultatif et public.'
guide.services.t: 'Trouver ou proposer un service'
guide.services.cta: 'Voir les services'
guide.services.s1: 'Parcourez les prestations (médiation, formation, accompagnement) et ouvrez celle qui convient.'
guide.services.s2: 'Commandez : le paiement est sécurisé et gardé en attente.'
guide.services.s3: 'Échangez avec le prestataire par la messagerie de la commande (pas de coordonnées à donner).'
guide.services.s4: 'Confirmez quand la prestation est faite : le prestataire est alors payé. Un souci ? Demandez un remboursement.'
guide.candidater.t: 'Obtenir un rôle'
guide.candidater.cta: 'Candidater'
guide.candidater.s1: 'Choisissez le droit : médiateur, acteur, élu ou association.'
guide.candidater.s2: 'Expliquez en quelques lignes ce que vous apporterez.'
guide.candidater.s3: 'L''équipe répond. Aucune ancienneté de compte n''est exigée.'
guide.candidater.s4: 'Votre espace dédié apparaît dans « Mon espace ».'
guide.acteurs.t: 'Agir auprès des institutions'
guide.acteurs.cta: 'Voies institutionnelles'
guide.acteurs.s1: 'Trouvez l''élu, l''institution ou le médiateur concerné.'
guide.acteurs.s2: 'Utilisez la voie légale adaptée (pétition, saisine, courrier).'
guide.acteurs.s3: 'Déposez ensuite le suivi sur la plateforme pour que tout le monde voie la réponse.'
guide.plan.t: 'Appliquer le plan près de chez vous'
guide.plan.cta: 'Déposer un résultat'
guide.plan.s1: 'Repérez dans la page l''action qui correspond à votre situation (citoyen, association, élu, entreprise).'
guide.plan.s2: 'Faites la première action de la liste « cette semaine ».'
guide.plan.s3: 'Déposez le résultat comme proposition pour qu''il soit comparé et repris ailleurs.'
