eco.title: 'Relancer l''économie française : le Plan Marshall citoyen'
eco.lede: 'Redresser sans casser : mesurer chaque dépense, mutualiser ce qui peut l''être, réinvestir les économies prouvées dans l''emploi, la production et les services essentiels.'
eco.l1t: 'Mesurer'
eco.l1d: 'Un diagnostic de coûts dans 3 à 5 structures volontaires.'
eco.l2t: 'Mutualiser'
eco.l2d: 'Achats groupés et fonctions support partagées, sans monopole.'
eco.l3t: 'Réinvestir'
eco.l3d: 'Chaque économie prouvée est réaffectée à l''emploi et aux missions utiles.'
eco.cta: 'Lire le plan'
eco.cta2: 'Agir cette semaine'
