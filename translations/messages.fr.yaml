commons.notice: 'Ce travail n''appartient à personne : il est le fruit de la contribution de citoyens du monde entier. Il ne revient en droit à aucune personne en particulier, et la démarche doit continuer, portée par toutes et tous.'
commons.title: 'Un bien commun'
commons.text: 'Ce projet n''appartient pas à son initiateur. Chaque citoyen du monde qui propose, relit, traduit, vérifie ou débat en est co-auteur. Aucune personne ne peut s''en réclamer propriétaire par droit. Pour qu''il dure, la démarche doit continuer : contribuez, transmettez, invitez.'
