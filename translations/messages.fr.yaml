peace.title: 'Appel au calme et à la paix'
peace.text: 'Dans un pays sous tension, la colère est légitime, la violence ne l''est jamais. Ici, on s''écoute, on source, on propose du concret, et on laisse à chacun un droit de réponse.'
peace.cta: 'Lire l''appel et la charte'
why.title: 'Pourquoi maintenant ?'
why.lede: 'Des constats officiels et sourcés, pas des slogans. Chacun peut les vérifier puis en débattre.'
why.f1: 'Déficit public 2025 : 5,0 % du PIB, objectif 2026 jugé menacé'
why.f2: 'Dette publique : 3 460 milliards d''euros fin 2025'
why.f3: 'Charge de la dette 2026 : environ 77 milliards d''euros, en hausse d''environ 12 milliards'
why.src: 'Source : Cour des comptes, constat du 25 juin 2026, relayé par Public Sénat. À vérifier et actualiser avant citation.'
why.more: 'Autres défis cités par les citoyens : pouvoir d''achat, emploi, services publics sous pression, confiance, transition énergétique, souveraineté.'
tax.title: 'Contribuables : vous financez, vous avez le droit de comprendre'
tax.lede: 'Chaque proposition doit dire combien elle coûte, qui paie et comment on mesure le résultat. Voici comment agir concrètement.'
tax.c1t: 'Comprendre'
tax.c1d: 'Les rapports de la Cour des comptes et les données ouvertes sur les dépenses publiques, en accès libre.'
tax.c2t: 'Proposer une économie utile'
tax.c2d: 'Appliquez la règle des cinq questions du Plan Marshall et déposez une proposition chiffrée avec sa source.'
tax.c3t: 'Soutenir ce qui est mesuré'
tax.c3d: 'Les propositions les mieux sourcées et chiffrées montent dans le classement.'
tax.c4t: 'Demander des comptes'
tax.c4d: 'Déposez une revendication sourcée : elle est suivie jusqu''à une réponse publique.'
tax.cta1: 'Rapports de la Cour des comptes'
tax.cta2: 'Données ouvertes (data.gouv.fr)'
themes.title: 'Des solutions concrètes, par sujet'
themes.lede: 'Choisissez un sujet : vous y trouvez les propositions publiées, classées par soutiens.'
steps.title: 'Le parcours d''une proposition, en cinq étapes'
steps.1: 'Le citoyen s''exprime : il propose une idée et vote sur les priorités.'
steps.2: 'Les propositions sont relues et analysées, avec des experts et acteurs de terrain.'
steps.3: 'Les solutions sont regroupées en projets concrets, chiffrés, avec un calendrier.'
steps.4: 'Elles sont portées aux élus et institutions compétents.'
steps.5: 'Les citoyens suivent les décisions et la suite donnée.'
actors.title: 'Le rôle des acteurs publics et des contributeurs'
actors.lede: 'Tous peuvent contribuer, avec les mêmes règles : source publique, faits vérifiables, droit de réponse.'
actors.a1: 'Parlement (Assemblée nationale et Sénat)'
actors.a1d: 'Examiner les propositions, débattre, voter les lois, contrôler leur mise en œuvre.'
actors.a2: 'Collectivités territoriales'
actors.a2d: 'Organiser les débats locaux, relayer les propositions, mettre en œuvre les actions.'
actors.a3: 'Services de l''État'
actors.a3d: 'Analyser la faisabilité, mobiliser les moyens, assurer la coordination.'
actors.a4: 'Institutions européennes'
actors.a4d: 'Intégrer les propositions, soutenir les financements, renforcer la coopération.'
actors.a5: 'Associations, entreprises, citoyens'
actors.a5d: 'Apporter l''expertise de terrain, tester, mesurer, partager les résultats.'
actors.cta: 'Devenir acteur'
claims.cta: 'Déposer une revendication sourcée'
claims.rules: 'Règle commune à tous les acteurs, institutions et partis : source publique, faits vérifiables, aucune insulte, droit de réponse, relecture avant publication.'
forces.title: 'Comprendre pour mieux choisir'
forces.lede: 'Les grands courants politiques présentés avec la même structure, sans note ni classement. À vous de comparer.'
forces.cta: 'Voir les forces politiques'
run.title: 'Se présenter à la présidentielle de 2027 : les règles'
run.c1: 'Être de nationalité française, avoir au moins 18 ans, être inscrit sur une liste électorale.'
run.c2: 'Ne pas être déclaré inéligible, ni sous tutelle ou curatelle, avoir satisfait aux obligations du service national.'
run.c3: 'Obtenir 500 parrainages d''élus, venant d''au moins 30 départements ou collectivités d''outre-mer, avec au plus un dixième dans un même département.'
run.c4: 'Déposer auprès du Conseil constitutionnel une déclaration d''intérêts et une déclaration de patrimoine.'
run.src: 'Source : LCP, conditions de candidature. Les dates officielles sont publiées par le Conseil constitutionnel.'
run.cta: 'Conseil constitutionnel'
