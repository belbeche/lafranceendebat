free.title: Gratuit, pour toujours
free.body: 'La France en Débat est et restera gratuite pour tous les citoyens : aucun abonnement, aucun paiement pour s''inscrire, voter ou proposer, aucune publicité et aucune revente de données personnelles. Les fonctions de base ne seront jamais mises derrière un paiement.'
