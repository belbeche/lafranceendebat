guide.label: 'Passo a passo'
guide.steps: 'etapas'
guide.page_title: 'Passo a passo'
guide.page_lede: 'Cada função do site explicada em poucas etapas. Nenhum conhecimento técnico necessário.'
guide.home.t: 'Primeiros passos'
guide.home.cta: 'Criar a minha conta'
guide.home.s1: 'Crie uma conta gratuita (um minuto, basta um e-mail).'
guide.home.s2: 'Escolha por onde começar: debater, propor, dar a sua opinião ou agir junto das instituições.'
guide.home.s3: 'Volte a «O meu espaço»: verá o ponto da situação das suas ideias e o que falta fazer.'
guide.communaute.t: 'Participar na conversa'
guide.communaute.cta: 'Abrir um tópico'
guide.communaute.s1: 'Leia as regras à direita, cabem em quatro linhas.'
guide.communaute.s2: 'Clique em «Abrir um tópico» e escreva com calma, com um título preciso.'
guide.communaute.s3: 'Responda aos outros reformulando primeiro a ideia deles: é valorizado na classificação.'
guide.communaute.s4: 'Uma mensagem problemática? Use «Denunciar», a equipa responde com um motivo.'
guide.debats.t: 'Participar num debate'
guide.debats.cta: 'Ver os debates'
guide.debats.s1: 'Abra um debate e leia primeiro os factos fundamentados.'
guide.debats.s2: 'Acrescente um argumento a favor, contra ou matizado, com fonte se possível.'
guide.debats.s3: 'Apoie os argumentos mais sólidos, mesmo que contrariem a sua opinião.'
guide.propositions.t: 'Apresentar e fazer avançar uma proposta'
guide.propositions.cta: 'Apresentar uma proposta'
guide.propositions.s1: 'Clique em «Apresentar uma proposta»: problema, medida, custo estimado, quem pode agir.'
guide.propositions.s2: 'É revista e publicada no registo (em geral em 48 h).'
guide.propositions.s3: 'Partilhe-a: cada apoio sobe-a na classificação.'
guide.propositions.s4: 'Acompanhe-a em «O meu espaço» até ser transmitida aos eleitos.'
guide.scrutins.t: 'Dar a sua opinião'
guide.scrutins.cta: 'Ver as consultas'
guide.scrutins.s1: 'Escolha uma consulta aberta.'
guide.scrutins.s2: 'Leia as opções e os argumentos.'
guide.scrutins.s3: 'Vote: uma voz por pessoa, resultado consultivo e público.'
guide.services.t: 'Encontrar ou propor um serviço'
guide.services.cta: 'Ver os serviços'
guide.services.s1: 'Explore os serviços (mediação, formação, acompanhamento) e abra o adequado.'
guide.services.s2: 'Encomende: o pagamento é seguro e fica retido.'
guide.services.s3: 'Fale com o prestador pela mensagem da encomenda (sem dar contactos).'
guide.services.s4: 'Confirme quando o serviço estiver feito: o prestador é então pago. Algum problema? Peça um reembolso.'
guide.candidater.t: 'Obter um papel'
guide.candidater.cta: 'Candidatar-se'
guide.candidater.s1: 'Escolha o direito: mediador, ator, eleito ou associação.'
guide.candidater.s2: 'Explique em poucas linhas o que irá trazer.'
guide.candidater.s3: 'A equipa responde. Não é exigida antiguidade da conta.'
guide.candidater.s4: 'O seu espaço dedicado aparece em «O meu espaço».'
guide.acteurs.t: 'Agir junto das instituições'
guide.acteurs.cta: 'Vias institucionais'
guide.acteurs.s1: 'Encontre o eleito, a instituição ou o mediador em causa.'
guide.acteurs.s2: 'Use a via legal adequada (petição, recurso, carta).'
guide.acteurs.s3: 'Publique depois o acompanhamento na plataforma para que todos vejam a resposta.'
guide.plan.t: 'Aplicar o plano perto de si'
guide.plan.cta: 'Apresentar um resultado'
guide.plan.s1: 'Encontre na página a ação adequada à sua situação (cidadão, associação, eleito, empresa).'
guide.plan.s2: 'Faça a primeira ação da lista «esta semana».'
guide.plan.s3: 'Apresente o resultado como proposta para ser comparado e replicado noutros locais.'
