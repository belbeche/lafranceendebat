eco.title: 'Relançar a economia francesa: o Plano Marshall cidadão'
eco.lede: 'Recuperar sem destruir: medir cada despesa, mutualizar o que for possível e reinvestir as poupanças comprovadas em emprego, produção e serviços essenciais.'
eco.l1t: 'Medir'
eco.l1d: 'Um diagnóstico de custos em 3 a 5 estruturas voluntárias.'
eco.l2t: 'Mutualizar'
eco.l2d: 'Compras conjuntas e funções de apoio partilhadas, sem monopólio.'
eco.l3t: 'Reinvestir'
eco.l3d: 'Cada poupança comprovada volta ao emprego e às missões úteis.'
eco.cta: 'Ler o plano'
eco.cta2: 'Agir esta semana'
