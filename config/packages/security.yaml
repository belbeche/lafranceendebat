security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_MODERATOR]
        ROLE_MODERATOR: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_hub
                username_parameter: _username
                password_parameter: _password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true
                clear_site_data: ['cache', 'cookies', 'storage']
            remember_me:
                lifetime: 604800
                path: /
                secure: auto
                httponly: true
                samesite: lax
                signature_properties: [password, sessionStamp]

    access_control:
        # L'ordre compte : la première règle qui correspond s'applique.
        # L'administration exige une connexion recente (le cookie "se souvenir de moi" ne suffit pas).
        - { path: ^/admin/moderation, roles: [ROLE_MODERATOR, IS_AUTHENTICATED_FULLY] }
        - { path: ^/admin, roles: [ROLE_ADMIN, IS_AUTHENTICATED_FULLY] }
        # Anciens points d'entrée SES sans vérification de signature : fermés au public. Seul POST /webhook/ses (signé) est utilisé.
        - { path: ^/webhook/ses/, roles: ROLE_ADMIN }
        - { path: ^/propositions/(nouvelle|mes-propositions), roles: ROLE_USER }
        - { path: ^/proposition/\d+/(soutenir|retirer-soutien), roles: ROLE_USER }
        - { path: ^/propositions/\d+/amender, roles: ROLE_USER }
        - { path: ^/propositions/\d+/avis-acteur, roles: ROLE_USER }
        - { path: ^/(messages|notifications|api/live|api/notifications|mes-demandes|debats/ouvrir|agenda/proposer), roles: ROLE_USER }
        - { path: ^/debats/[a-z0-9-]+/(arguments|gerer), roles: ROLE_USER }
        - { path: '^/(propositions|communaute|revendications)/.+/(modifier|retirer)$', roles: ROLE_USER }
        - { path: ^/communaute/(nouveau|\d+/repondre|reponse/\d+/merci), roles: ROLE_USER }
        - { path: ^/classement/participation, roles: ROLE_USER }
        - { path: ^/scrutins/\d+/voter, roles: ROLE_USER }
        - { path: ^/journalistes/(ecrire|mes-tribunes), roles: ROLE_USER }
        - { path: ^/candidater, roles: ROLE_USER }
        - { path: ^/services/(mes-commandes|\d+/commander|commande), roles: ROLE_USER }
        - { path: ^/espace-acteur, roles: ROLE_USER }
        - { path: ^/espace/, roles: ROLE_USER }
        - { path: ^/traduire, roles: ROLE_USER }
        - { path: ^/revendications/proposer, roles: ROLE_USER }
        - { path: ^/mon-espace, roles: ROLE_USER }
        - { path: ^/signaler, roles: ROLE_USER }
        - { path: ^/profil, roles: ROLE_USER }
        # Tout le reste (accueil, lecture, connexion, inscription, pages légales) est public.
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
